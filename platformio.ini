; Fox Voice Companion — PlatformIO + Arduino (the toolchain the working
; mic-avatar and factory firmware use on this exact hardware). This replaces the
; fragile ESP-IDF + arduino-as-component hybrid that never ran setup().
;
; PART 1 (this build): the substantial fox core — display, audio, animated face
; + lip-sync, personality/mood, conversational response engine, games, IMU
; toys, IR, on-device tiny-LLM, memory. Everything EXCEPT MultiNet speech-to-
; text (that's Part 2, added on top once this boots on your device).

[env:atoms3r]
platform = espressif32@8.2.0
framework = arduino
; Same board id the proven avatar uses; M5Unified autodetects the actual
; AtomS3R (incl. the newer ST7735 panel) at runtime. board only sets flash/
; partition defaults + the ARDUINO_M5STACK_ATOMS3 macro.
board = m5stack-atoms3
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; AtomS3R has OCTAL PSRAM — this is the psram config that already worked.
board_build.arduino.memory_type = qio_opi

upload_speed = 1500000
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DECHO_BASE

; A recent M5Unified/M5GFX is what knows the newer ST7735 AtomS3R panel (older
; ones bind no display -> the black screen you saw on some launcher binaries).
lib_deps =
    m5stack/M5Unified@^0.2.19
    bblanchon/ArduinoJson@^7.0.0
build_src_flags = -I src/echobase
lib_ldf_mode = deep
