name: build-and-flash

# Full pipeline on GitHub: build the PlatformIO firmware, generate the brain +
# IR data, assemble the esp-web-tools manifests, and deploy the web flasher to
# GitHub Pages — so you flash from the browser exactly as before.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO + numpy
        run: |
          pip install --upgrade platformio "numpy>=1.26"

      - name: Build firmware (PlatformIO)
        run: pio run -e atoms3r

      - name: Generate brain + IR data
        run: |
          # IR library (FOXI) -> foxdata partition
          python tools/build_ir.py \
            --out data/fox_ir.bin \
            --tv assets/ir/tv.ir --audio assets/ir/audio.ir \
            --projector assets/ir/projector.ir --ac assets/ir/ac.ir
          # brain packs (FOXB) -> foxbrain partition (A=chatterbox, B=critter)
          python tools/train_brain.py --pack A --out data/foxbrainA.bin --steps 6000
          python tools/train_brain.py --pack B --out data/foxbrainB.bin --steps 5000

      - name: Assemble flash images + esp-web-tools manifests
        run: |
          set -e
          mkdir -p site/firmware
          B=.pio/build/atoms3r
          # PlatformIO/Arduino ESP32-S3 flash layout. Offsets match partitions.csv:
          #   bootloader @0x0 (S3), partitions @0x8000, boot_app0 @otadata(0xf000),
          #   app(firmware) @factory(0x20000). Data partitions from partitions.csv.
          cp "$B/bootloader.bin"  site/firmware/bootloader.bin
          cp "$B/partitions.bin"  site/firmware/partitions.bin
          cp "$B/firmware.bin"    site/firmware/firmware.bin
          cp data/fox_ir.bin      site/firmware/foxdata.bin
          cp data/foxbrainA.bin   site/firmware/foxbrainA.bin
          cp data/foxbrainB.bin   site/firmware/foxbrainB.bin

          # offsets straight from partitions.csv so they can never drift
          off() { python3 -c "
          import csv,sys
          for r in csv.reader(open('partitions.csv')):
              r=[c.strip() for c in r if c.strip()]
              if r and r[0]=='$1': print(int(r[3],16))"; }
          APP=$(off factory); FOXBRAIN=$(off foxbrain); FOXDATA=$(off foxdata)

          gen() {  # $1 = brain bin, $2 = out manifest
            cat > "site/firmware/$2" <<JSON
          {
            "name": "Fox Voice Companion",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                { "path": "bootloader.bin", "offset": 0 },
                { "path": "partitions.bin", "offset": 32768 },
                { "path": "firmware.bin",   "offset": ${APP} },
                { "path": "$1",             "offset": ${FOXBRAIN} },
                { "path": "foxdata.bin",    "offset": ${FOXDATA} }
              ]
            }]
          }
          JSON
          }
          gen foxbrainA.bin manifest.json
          gen foxbrainB.bin manifest-b.json
          echo "=== manifest.json ==="; cat site/firmware/manifest.json

      - name: Assemble site (web flasher at root)
        run: |
          cp -r web/* site/
          touch site/.nojekyll
          echo "Site:"; ls -la site site/firmware

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
